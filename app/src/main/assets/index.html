<!doctype html><html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no"><title>Albion Craft</title><style>:root{--bg:#0d1117;--card:#151b23;--card2:#1b2330;--line:#293241;--text:#edf2f7;--muted:#8d9aaa;--gold:#d7a84b;--green:#62d69a;--red:#f07c7c}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--text);font:15px system-ui,-apple-system,Segoe UI,sans-serif}.app{max-width:620px;margin:auto;padding:18px 15px 40px}.top{display:flex;justify-content:space-between;align-items:center;margin-bottom:18px}h1{font-size:21px;margin:0}.sub{color:var(--muted);font-size:12px;margin-top:3px}.card{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:15px;margin:11px 0}.section{font-weight:700;margin-bottom:12px}.grid{display:grid;grid-template-columns:1fr 1fr;gap:10px}label{display:block;color:var(--muted);font-size:12px;margin-bottom:6px}input{width:100%;background:#0f141b;border:1px solid var(--line);border-radius:10px;color:var(--text);padding:11px 9px;font-size:15px;outline:none}input:focus{border-color:var(--gold)}button{border:0;border-radius:10px;padding:10px 12px;background:var(--card2);color:var(--text);font-weight:600}.add{width:100%;margin-top:10px;border:1px dashed #465363;background:transparent;color:var(--gold)}.mat{display:grid;grid-template-columns:1.35fr .7fr .9fr 36px;gap:7px;margin-bottom:7px}.check{display:flex;align-items:center;justify-content:center}.check input{width:18px;height:18px}.remove{padding:7px;background:transparent;color:var(--muted)}.result{display:grid;gap:9px}.r{display:flex;justify-content:space-between}.r span:first-child{color:var(--muted)}.profit{font-size:20px;font-weight:800;color:var(--green)}.negative{color:var(--red)}.divider{height:1px;background:var(--line);margin:7px 0}.small{font-size:11px;color:var(--muted)}.actions{display:flex;gap:8px}.actions button{flex:1}</style></head><body><div class="app"><div class="top"><div><h1>ALBION CRAFT</h1><div class="sub">수동 제작 수익 계산기 · 오프라인</div></div><button onclick="resetAll()">초기화</button></div><div class="card"><div class="section">제작 설정</div><div class="grid"><div><label>반환율 (%)</label><input id="rrr" type="number" value="15" step="0.1" oninput="calc()"></div><div><label>제작 횟수</label><input id="runs" type="number" value="1" min="1" oninput="calc()"></div><div><label>제작 수수료 / 1회</label><input id="craftFee" type="number" value="0" oninput="calc()"></div><div><label>판매 수수료 (%)</label><input id="sellFee" type="number" value="0" step="0.1" oninput="calc()"></div></div></div><div class="card"><div class="section">재료</div><div id="materials"></div><button class="add" onclick="addMat()">＋ 재료 추가</button><div class="small" style="margin-top:9px">☑ 반환 대상 · ☐ 비반환 재료(아티팩트 등)</div></div><div class="card"><div class="section">판매</div><div class="grid"><div><label>완제품 수량 / 1회</label><input id="outputQty" type="number" value="1" min="1" oninput="calc()"></div><div><label>완제품 판매가 / 개</label><input id="sellPrice" type="number" value="0" oninput="calc()"></div><div><label>목표 ROI (%)</label><input id="targetROI" type="number" value="20" step="0.1" oninput="calc()"></div></div></div><div class="card"><div class="section">계산 결과</div><div class="result"><div class="r"><span>총 구매비</span><b id="buy">0</b></div><div class="r"><span>반환 재료 가치</span><b id="refund">0</b></div><div class="r"><span>실질 재료비</span><b id="netMat">0</b></div><div class="r"><span>제작 비용</span><b id="fee">0</b></div><div class="divider"></div><div class="r"><span>실질 총원가</span><b id="cost">0</b></div><div class="r"><span>예상 매출</span><b id="revenue">0</b></div><div class="r"><span>판매 수수료</span><b id="sellTax">0</b></div><div class="r"><span>순이익</span><b id="profit" class="profit">0</b></div><div class="r"><span>개당 순이익</span><b id="unitProfit">0</b></div><div class="r"><span>ROI</span><b id="roi">0%</b></div><div class="divider"></div><div class="r"><span>손익분기 판매가</span><b id="breakeven">0</b></div><div class="r"><span>목표 ROI 판매가</span><b id="targetPrice">0</b></div></div></div><div class="actions"><button onclick="copyResult()">결과 복사</button><button onclick="addExample()">예시 입력</button></div></div><script>const $=id=>document.getElementById(id),fmt=n=>Math.round(n).toLocaleString('ko-KR');function addMat(name='',q=1,p=0,r=true){let d=document.createElement('div');d.className='mat';d.innerHTML='<input placeholder="재료명" value="'+name+'"><input type="number" min="0" value="'+q+'" oninput="calc()"><input type="number" min="0" value="'+p+'" oninput="calc()"><div class="check"><input type="checkbox" '+(r?'checked':'')+' onchange="calc()"></div>';$('materials').appendChild(d);calc()}function mats(){return [...document.querySelectorAll('.mat')].map(x=>{let i=x.querySelectorAll('input');return{q:+i[1].value||0,p:+i[2].value||0,r:i[3].checked}})}function calc(){let rr=(+$('rrr').value||0)/100,runs=+$('runs').value||0,buy=0,refund=0;mats().forEach(m=>{buy+=m.q*m.p*runs;if(m.r)refund+=m.q*m.p*runs*rr});let net=buy-refund,fee=(+$('craftFee').value||0)*runs,cost=net+fee,revenue=(+$('outputQty').value||0)*(+$('sellPrice').value||0)*runs,tax=revenue*((+$('sellFee').value||0)/100),profit=revenue-tax-cost,units=(+$('outputQty').value||0)*runs,roi=cost?profit/cost*100:0,be=units?cost/(units*(1-(+$('sellFee').value||0)/100)):0,tp=units?cost*(1+(+$('targetROI').value||0)/100)/(units*(1-(+$('sellFee').value||0)/100)):0;$('buy').textContent=fmt(buy);$('refund').textContent=fmt(refund);$('netMat').textContent=fmt(net);$('fee').textContent=fmt(fee);$('cost').textContent=fmt(cost);$('revenue').textContent=fmt(revenue);$('sellTax').textContent=fmt(tax);$('profit').textContent=fmt(profit);$('profit').className=profit>=0?'profit':'profit negative';$('unitProfit').textContent=fmt(units?profit/units:0);$('roi').textContent=(isFinite(roi)?roi:0).toFixed(1)+'%';$('breakeven').textContent=fmt(be);$('targetPrice').textContent=fmt(tp);localStorage.albionCal=JSON.stringify({rrr:$('rrr').value,runs:$('runs').value,craftFee:$('craftFee').value,sellFee:$('sellFee').value,outputQty:$('outputQty').value,sellPrice:$('sellPrice').value,targetROI:$('targetROI').value})}function resetAll(){localStorage.removeItem('albionCal');$('materials').innerHTML='';$('rrr').value=15;$('runs').value=1;$('craftFee').value=0;$('sellFee').value=0;$('outputQty').value=1;$('sellPrice').value=0;$('targetROI').value=20;addMat()}function addExample(){$('materials').innerHTML='';addMat('재료 A',8,1200,true);addMat('재료 B',4,800,true);addMat('아티팩트',1,20000,false);$('rrr').value=15;$('runs').value=100;$('craftFee').value=500;$('sellFee').value=8;$('outputQty').value=1;$('sellPrice').value=15000;calc()}function copyResult(){navigator.clipboard?.writeText('Albion Craft\n실질 원가: '+$('cost').textContent+'\n예상 매출: '+$('revenue').textContent+'\n순이익: '+$('profit').textContent+'\nROI: '+$('roi').textContent+'\n손익분기: '+$('breakeven').textContent);alert('결과를 복사했습니다.')}addMat('재료',1,0,true);</script></body></html>
